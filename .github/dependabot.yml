# Mises à jour des actions GitHub épinglées par SHA (ci.yml, references.yml).
# Chaque mise à jour arrive en pull request, passe la CI et n'est fusionnée
# que par le mainteneur (aucune fusion automatique ; CLAUDE.md, « Git et
# GitHub »). Les versions majeures sont ignorées : une montée majeure se
# décide à part (décision du mainteneur du 28/09/2026, PR #138 fermée), avec
# un essai de references.yml, que la CI des pull requests ne lance pas.
# Commentaire de version des lignes uses: sous la forme « # vX.Y.Z », que
# Dependabot met à jour avec le SHA.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Une seule PR hebdomadaire pour l'ensemble des actions.
    groups:
      actions:
        patterns:
          - "*"
    # Domaine des messages de commit du dépôt (CLAUDE.md) : repo:.
    commit-message:
      prefix: "repo"
    # Libellé canonique de tri (docs/agents/triage-labels.md).
    labels:
      - "needs-triage"
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
