# Mises à jour des actions GitHub épinglées par SHA (ci.yml, references.yml).
# Chaque mise à jour arrive en pull request, passe la CI et n'est fusionnée
# que par le mainteneur (aucune fusion automatique ; CLAUDE.md, « Git et
# GitHub »). Les versions majeures sont proposées comme les autres : leur
# fusion suit la même revue.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Une seule PR hebdomadaire pour l'ensemble des actions.
    groups:
      actions:
        patterns:
          - "*"
    # Domaine des messages de commit du dépôt (CLAUDE.md) : repo:.
    commit-message:
      prefix: "repo"
    # Libellé canonique de tri (docs/agents/triage-labels.md).
    labels:
      - "needs-triage"
    open-pull-requests-limit: 2
