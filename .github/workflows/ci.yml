name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Lecture seule : aucune étape n'écrit dans le dépôt (checkout en lecture ;
# upload-artifact et actions/cache passent par le jeton d'exécution d'Actions,
# pas par GITHUB_TOKEN ; le résumé du job est un fichier du runner).
permissions:
  contents: read

# Issue #123 : un nouveau push sur une PR annule l'exécution en cours de la
# même PR (minutes d'Actions). Les exécutions sur main ne sont jamais
# annulées. references.yml n'est pas concerné (groupe distinct, aucune
# annulation d'une régénération par un push).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Issue #123 : filtres de chemins au niveau des jobs. Sur une PR, la liste
  # des fichiers modifiés est celle du commit de fusion de test contre son
  # premier parent (la base) ; git seul, sans action tierce ni permission
  # supplémentaire. Push sur main et lancement manuel : tout s'exécute.
  # Un job sauté par son « if » a le statut « ignoré », qui ne bloque pas une
  # vérification requise.
  changements:
    name: Fichiers modifiés
    runs-on: ubuntu-22.04
    # Durée observée : moins de 10 s.
    timeout-minutes: 5
    outputs:
      moteur: ${{ steps.filtre.outputs.moteur }}
      latex: ${{ steps.filtre.outputs.latex }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Filtre des chemins
        id: filtre
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Événement ${{ github.event_name }} : tous les jobs s'exécutent."
            echo "moteur=true" >> "$GITHUB_OUTPUT"
            echo "latex=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Sûreté : si la liste ne peut pas être établie, tout s'exécute
          # (jamais un job requis sauté à tort).
          if ! git diff --name-only HEAD^1 HEAD > fichiers.txt; then
            echo "::warning title=Filtre des chemins::liste des fichiers indisponible, tous les jobs s'exécutent."
            echo "moteur=true" >> "$GITHUB_OUTPUT"
            echo "latex=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Fichiers modifiés par la PR :"; cat fichiers.txt
          # Tests du moteur : moteur, application, tests, dépendances, CI.
          if grep -qE '^(R/|app\.R$|tests/|DESCRIPTION$|\.github/)' fichiers.txt; then
            echo "moteur=true" >> "$GITHUB_OUTPUT"
          else
            echo "moteur=false" >> "$GITHUB_OUTPUT"
          fi
          # Documentation LaTeX (et concordance, qui lit le .tex) : docs/latex/, CI,
          # et les contrôles ND de la documentation (issue #451), qui lisent le
          # .tex, le .aux, le .log et le PDF de la compilation.
          if grep -qE '^(docs/latex/|tests/(controle_doc_nd\.R|marques_remplissage\.tex|doc_remplissage\.tex)$|\.github/)' fichiers.txt; then
            echo "latex=true" >> "$GITHUB_OUTPUT"
          else
            echo "latex=false" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

  # Issue #512 (branche K1) : le job unique « Tests du moteur » (992 s au
  # run 1152 de 9f7290f, chemin critique de la CI) est réparti en quatre
  # jobs, qui ne retirent aucun contrôle :
  #   - tests-unitaires : les tests unitaires en matrice de 3 lots ;
  #   - reproductibilite : reproductibilité, tableau des écarts aux références
  #     (#66) et concordance --strict, en parallèle des lots ;
  #   - ecarts-references : le tableau des écarts après un échec d'un lot ;
  #   - tests-moteur : agrégat, qui garde le NOM de l'ancien job, requis par
  #     les rulesets « Protection main » et « Protection main-GPT » (ADR 0012) :
  #     sans lui, la vérification requise ne serait jamais rapportée.
  # Image épinglée (issue #67, Q-O4) : la même que celle du workflow de
  # production des références (references.yml), pour que les références
  # soient testées sur la plateforme qui les produit. ubuntu-latest
  # changerait d'image sans commit. Le BLAS est fixé à part (action
  # blas-reference) : l'épinglage de l'image ne l'empêchait pas de varier
  # avec le processeur du runner (OpenBLAS).
  #
  # Répartition en lots (issue #512, docs/revues/20261108-duree-ci/mesures/
  # sharding.R, durées du run 1152, test_merz_wuthrich coupé en deux fichiers
  # d'environ même durée, simulation) : chemin critique estimé, préparation
  # comprise (setup-r 39 s, BLAS 5 s, paquets de l'application 7 s avec le
  # cache), 417 s à 2 lots, 296 s à 3 lots, 246 s à 4 lots (au lieu de 992 s
  # en un job). Trois lots : le 4e ne gagne qu'une cinquantaine de secondes,
  # borné par test_application (195 s en CI) et par la préparation, pour une
  # minute et demie de runner de plus et un setup-r lent de plus à courir
  # (14 min 36 s le 04/11/2026). La répartition (LPT sur
  # tests/durees_unitaires.tsv) est celle de tests/test_unitaires.R --lot=k/n :
  # chaque fichier est dans un lot et un seul, la réunion des lots est la
  # batterie complète. Le lot 1 contient seul les fichiers qui exigent shiny
  # ou plotly (test_application, test_rapport_html, test_enveloppe_qq,
  # test_enveloppe_spread, test_incertitude_bootstrap), regroupés pour
  # l'ordonnancement ; shiny et plotly sont néanmoins installés dans les trois
  # lots (cache commun, quelques secondes sur un hit), pour qu'un fichier qui
  # les exigerait sans que la détection du lanceur (motif sur son texte) le voie
  # ne saute pas ses blocs en silence dans un lot sans eux.
  tests-unitaires:
    name: Tests unitaires (lot ${{ matrix.lot }}/${{ matrix.total }})
    runs-on: ubuntu-22.04
    # Issue #123 : seulement si le moteur change (le .tex seul ne les lance pas).
    needs: changements
    if: needs.changements.outputs.moteur == 'true'
    # Durées de l'ancien job unique (avant l'issue #512) : tests unitaires en
    # séquentiel (job de 039ec76, 05/11/2026, exécution 41886457559) : 32 min
    # 02 s ; branche Fs, 04/11/2026 : 38 min 47 s pour le job vert de 4505ae3,
    # dont 33 min 44 s de tests unitaires et 47 s de setup-r. Un setup-r lent
    # du runner (14 min 36 s le même jour, 15 min le 23/10) avait suffi à
    # dépasser l'ancien délai de 40 min sans aucun échec de test. Un lot dure
    # environ 4 à 5 min (simulation) : le délai de 30 min laisse la marge d'un
    # setup-r lent de 15 min.
    timeout-minutes: 30
    strategy:
      # Un lot en échec n'annule pas les autres : tous les échecs sont visibles.
      fail-fast: false
      matrix:
        lot: [1, 2, 3]
        # Nombre de lots, en un seul endroit (nom du job et option --lot).
        total: [3]
    env:
      VERSION_R: "4.3.1"
      # Instantané Posit Package Manager (CRAN au 15/02/2024) et versions
      # attendues des paquets de l'application : voir l'étape d'installation.
      DATE_INSTANTANE: "2024-02-15"
      VERSION_SHINY: "1.8.0"
      VERSION_PLOTLY: "4.10.4"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        id: installer_r
        with:
          # Version de R de la CI (le poste de développement avait R 4.3.3
          # au relevé du 07/11/2026, issue #435 ; issue #505).
          r-version: ${{ env.VERSION_R }}
      # Issue #391 (R27) : shiny et plotly, pour que tests/unitaires/
      # test_application.R (bloc testServer) et les tests plotly de
      # test_rapport_html.R, test_enveloppe_qq.R, test_enveloppe_spread.R et
      # test_incertitude_bootstrap.R s'exécutent en CI au lieu de sauter
      # (requireNamespace() faux). Issue #512 : dans chaque lot de la matrice.
      # Versions épinglées par un instantané daté
      # de Posit Package Manager (binaires Ubuntu 22.04 : CRAN au 15/02/2024,
      # soit shiny 1.8.0 et plotly 4.10.4, avec toutes leurs dépendances ;
      # l'instantané ne change jamais, contrairement à « latest »). Ces versions
      # sont celles de la CI seule : le poste de développement a d'autres
      # versions (shiny 1.12.1 et plotly 4.12.0 relevés le 07/11/2026, issue
      # #435), qui ne servent pas de référence (issue #505). R pur : aucun
      # appel à apt, donc aucun paquet système (OpenBLAS compris) n'est
      # installé ici ; le
      # contrôle bloquant du BLAS vient après, à l'étape suivante, et valide
      # l'état final. La version de R reste celle de l'étape précédente.
      #
      # Issue #512 (A4) : les paquets sont mis en cache (actions/cache,
      # épinglée par SHA). Clé : système, version de R, date de l'instantané
      # et versions de shiny et plotly, donc un instantané ou une version de R
      # différents ne servent jamais le cache d'un autre. Le cache ne contient
      # que ce qu'install.packages() a posé dans la bibliothèque d'installation
      # ; il est écrit à la fin du job si celui-ci réussit, et le contrôle
      # bloquant ci-dessous valide les versions chargées avec ou sans cache. Si
      # l'image du runner change de bibliothèques système au point de casser un
      # binaire en cache, ce contrôle échoue : changer la clé (DATE_INSTANTANE
      # ou une mention dans la clé) pour repartir d'un cache vide. La clé est
      # commune aux trois lots : au premier run (miss), chacun installe et le
      # premier à finir écrit le cache, les autres signalent seulement qu'il
      # existe déjà ; ensuite les trois lots le relisent.
      # Bibliothèque d'installation : la première du chemin d'un processus
      # R neuf (celle que verront les Rscript des étapes suivantes) si elle
      # est inscriptible ; sinon R_LIBS_USER, créée ici et lue au démarrage
      # des processus suivants parce qu'elle existe alors.
      - name: Bibliothèque des paquets R de l'application
        id: biblio
        run: |
          set -euo pipefail
          bib="$(Rscript -e '
            bib <- .libPaths()[1L]
            if (file.access(bib, 2L) != 0L) {
              bib <- Sys.getenv("R_LIBS_USER")
              if (!nzchar(bib)) stop("aucune bibliothèque inscriptible et R_LIBS_USER vide.")
              dir.create(bib, recursive = TRUE, showWarnings = FALSE)
            }
            cat(bib)')"
          echo "Bibliothèque d'installation : $bib"
          echo "chemin=$bib" >> "$GITHUB_OUTPUT"
      - name: Cache des paquets R de l'application
        id: cache_paquets
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.biblio.outputs.chemin }}
          key: paquets-app-${{ runner.os }}-${{ runner.arch }}-R${{ env.VERSION_R }}-ppm${{ env.DATE_INSTANTANE }}-shiny${{ env.VERSION_SHINY }}-plotly${{ env.VERSION_PLOTLY }}
      - name: Paquets R de l'application (shiny, plotly), versions épinglées
        if: steps.cache_paquets.outputs.cache-hit != 'true'
        env:
          BIBLIOTHEQUE: ${{ steps.biblio.outputs.chemin }}
        run: |
          set -euo pipefail
          export INSTANTANE_CRAN="https://packagemanager.posit.co/cran/__linux__/jammy/${DATE_INSTANTANE}"
          Rscript - <<'EOF'
          bib <- Sys.getenv("BIBLIOTHEQUE")
          .libPaths(c(bib, .libPaths()))
          cat("Bibliothèque d'installation :", bib, "\n")
          # Agent utilisateur déclaré : Posit Package Manager sert alors des
          # binaires (sans lui, des sources à compiler).
          options(HTTPUserAgent = sprintf("R/%s R (%s)", getRversion(),
                    paste(getRversion(), R.version$platform, R.version$arch, R.version$os)))
          install.packages(c("shiny", "plotly"), lib = bib, Ncpus = 2L,
                           repos = c(CRAN = Sys.getenv("INSTANTANE_CRAN")))
          ip <- installed.packages(lib.loc = bib)[, c("Package", "Version")]
          cat(sprintf("%d paquets installés dans %s :\n", nrow(ip), bib))
          write.table(ip[order(ip[, "Package"]), ], row.names = FALSE, quote = FALSE)
          EOF
      # Contrôle bloquant dans un processus R NEUF, sans .libPaths() : il voit
      # exactement ce que verront les Rscript des étapes suivantes. Un
      # écart (version, chargement, bibliothèque non lue) échoue ici ; sans
      # lui, test_application.R sauterait son bloc shiny en silence. Il s'exécute
      # aussi quand les paquets viennent du cache.
      - name: Contrôle des paquets R de l'application
        run: |
          Rscript -e '
            attendu <- c(shiny = Sys.getenv("VERSION_SHINY"), plotly = Sys.getenv("VERSION_PLOTLY"))
            for (p in names(attendu)) {
              if (!requireNamespace(p, quietly = TRUE)) stop(sprintf("%s absent ou non chargeable.", p))
              v <- as.character(packageVersion(p))
              if (!identical(v, unname(attendu[p])))
                stop(sprintf("%s %s installé, %s attendu.", p, v, attendu[p]))
              cat(sprintf("%s %s (%s)\n", p, v, dirname(find.package(p))))
            }'
      # BLAS et LAPACK de référence, monothread, avec contrôle bloquant (R ne
      # doit pas charger OpenBLAS) : même action que references.yml, pour que
      # les références soient testées sous le BLAS qui les produit
      # (décision du 24/09/2026, exécution 36055472513, #40, #67).
      - name: BLAS et LAPACK de référence
        id: blas
        uses: ./.github/actions/blas-reference
      # Issue #444 : un processus Rscript par fichier, 4 à la fois (mode
      # --parallele de tests/test_unitaires.R, même bilan et même code de
      # sortie que le mode séquentiel), restreint au lot du job (issue #512).
      # nproc consigne le nombre de cœurs du runner dans le journal : les
      # assertions de durée « < 1 s » (test_application.R,
      # test_merz_wuthrich.R) subissent la charge des 4 processus. Le journal
      # est aussi écrit dans un fichier du runner, d'où le résumé du job ;
      # pipefail garde le code de sortie du lanceur.
      - name: Tests unitaires (lot ${{ matrix.lot }}/${{ matrix.total }})
        id: unitaires
        run: |
          set -o pipefail
          echo "Cœurs du runner : $(nproc)"
          Rscript tests/test_unitaires.R --parallele --lot=${{ matrix.lot }}/${{ matrix.total }} 2>&1 | tee "$RUNNER_TEMP/tests_unitaires.log"
      # Bilan du lot (assertions et échecs) dans le résumé du job, visible
      # depuis la PR. Le total des assertions de la CI est la somme des lots.
      - name: Bilan du lot (résumé du job)
        if: ${{ !cancelled() && steps.unitaires.outcome != 'skipped' }}
        run: |
          {
            echo "### Tests unitaires, lot ${{ matrix.lot }}/${{ matrix.total }}"
            echo
            echo '```'
            grep -E '^(Lot |Bilan du lot|TOTAL :|Duree totale|Fichiers en echec)' "$RUNNER_TEMP/tests_unitaires.log" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  reproductibilite:
    name: Reproductibilité et concordance
    # Même image et même BLAS que les lots (références testées sur la
    # plateforme qui les produit). Issue #123 : le job s'exécute si le moteur
    # ou le .tex change ; la reproductibilité seulement si le moteur change,
    # la concordance (qui lit le moteur et le .tex) dans les deux cas.
    runs-on: ubuntu-22.04
    needs: changements
    if: needs.changements.outputs.moteur == 'true' || needs.changements.outputs.latex == 'true'
    # Durées du run 1152 : setup-r 39 s, BLAS 5 s, reproductibilité 128 s,
    # concordance 26 s, soit environ 200 s. Délai de 30 min : marge d'un
    # setup-r lent (voir les lots).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        id: installer_r
        with:
          r-version: "4.3.1"
      - name: BLAS et LAPACK de référence
        id: blas
        uses: ./.github/actions/blas-reference
      - name: Reproductibilité et non-régression
        if: needs.changements.outputs.moteur == 'true'
        run: Rscript tests/test_reproductibilite.R
      # Issue #66 : si l'étape de reproductibilité a échoué, publie le tableau
      # des écarts aux références dans le résumé du job, visible depuis la PR.
      # Ne s'exécute pas quand tout est vert (coût nul) ; R doit avoir été
      # installé, sous le BLAS de référence (un tableau calculé sous un autre
      # BLAS mêlerait la dérive de plateforme aux écarts). Rapport seulement :
      # un job en échec le reste. Un échec des tests unitaires (autres jobs)
      # déclenche le même tableau dans le job « ecarts-references ».
      - name: Tableau des écarts aux références (après un échec)
        if: failure() && steps.installer_r.outcome == 'success' && steps.blas.outcome == 'success'
        run: Rscript tests/comparer_references.R --markdown "$GITHUB_STEP_SUMMARY"
      # Issue #65 (décision Q-O3) : concordance documentation ↔ moteur en mode
      # strict, bloquante. Le script exécute le moteur : l'étape est dans ce
      # job, où R est installé. Placée après le tableau des écarts pour que
      # son propre échec ne le déclenche pas ; lancée même si la
      # reproductibilité a échoué, pour que tous les écarts soient visibles.
      - name: Concordance documentation ↔ moteur (--strict)
        if: ${{ !cancelled() && steps.installer_r.outcome == 'success' }}
        run: Rscript tests/concordance_doc_moteur.R --strict

  # Issue #66 et #512 : avant la répartition, le tableau des écarts aux
  # références était publié après un échec des tests unitaires comme après un
  # échec de la reproductibilité. Les tests unitaires étant dans d'autres
  # jobs, ce job reproduit le premier cas : il ne s'exécute que si un lot a
  # échoué (coût nul sinon), avec le même R et le même BLAS. Rapport seulement :
  # le job reste vert, l'échec est porté par le lot et par l'agrégat.
  ecarts-references:
    name: Écarts aux références (après un échec des tests unitaires)
    runs-on: ubuntu-22.04
    needs: tests-unitaires
    if: ${{ always() && needs.tests-unitaires.result == 'failure' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          r-version: "4.3.1"
      - name: BLAS et LAPACK de référence
        uses: ./.github/actions/blas-reference
      - name: Tableau des écarts aux références
        run: Rscript tests/comparer_references.R --markdown "$GITHUB_STEP_SUMMARY"

  # Agrégat portant le nom de l'ancien job unique, vérification requise des
  # rulesets (voir plus haut). Réussit si et seulement si le job
  # « changements » et les jobs attendus ont réussi : les lots et la
  # reproductibilité quand le moteur change, la reproductibilité (concordance)
  # seule quand seul le .tex change. Sauté, comme l'ancien job, quand
  # « changements » a réussi et que ni le moteur ni le .tex ne changent ; un
  # échec ou une annulation de « changements » le fait exécuter et échouer
  # (sinon il serait sauté, donc passant, revue finale de K1). « always() » et non
  # « !cancelled() » : un lot ou la reproductibilité annulé doit faire échouer
  # l'agrégat (« cancelled » n'est pas « success »), sinon la vérification
  # requise resterait « Skipped », donc passante, après une annulation.
  tests-moteur:
    name: Tests du moteur (unitaires, reproductibilité)
    runs-on: ubuntu-22.04
    needs: [changements, tests-unitaires, reproductibilite]
    if: ${{ always() && (needs.changements.result != 'success' || needs.changements.outputs.moteur == 'true' || needs.changements.outputs.latex == 'true') }}
    timeout-minutes: 5
    env:
      CHANGEMENTS: ${{ needs.changements.result }}
      MOTEUR: ${{ needs.changements.outputs.moteur }}
      UNITAIRES: ${{ needs.tests-unitaires.result }}
      REPRODUCTIBILITE: ${{ needs.reproductibilite.result }}
    steps:
      - name: Résultat des jobs de tests
        run: |
          echo "Fichiers modifiés : $CHANGEMENTS (attendu : success)"
          if [ "$CHANGEMENTS" != "success" ]; then
            echo "::error title=Tests du moteur::le job « changements » n'a pas réussi."
            exit 1
          fi
          attendu_unitaires=skipped
          if [ "$MOTEUR" = "true" ]; then attendu_unitaires=success; fi
          echo "Tests unitaires : $UNITAIRES (attendu : $attendu_unitaires)"
          echo "Reproductibilité et concordance : $REPRODUCTIBILITE (attendu : success)"
          if [ "$UNITAIRES" != "$attendu_unitaires" ] || [ "$REPRODUCTIBILITE" != "success" ]; then
            echo "::error title=Tests du moteur::au moins un job de tests n'a pas réussi."
            exit 1
          fi

  documentation:
    name: Compilation de la documentation LaTeX
    # Contrôle de compilation, jamais commité (ADR 0008 amendé le 18/10/2026,
    # point 1). Le PDF versionné n'est commité qu'une fois par branche, en
    # fin de branche : en cours de branche il est en retard sur le .tex, et
    # le PDF à lire est l'artefact doc_tests_usp de la dernière exécution
    # (rétention de 30 jours). L'invariant « PDF versionné à jour du .tex »
    # est contrôlé par pdf-invariant.yml, sur les PR non brouillon.
    # Épinglée par cohérence avec le job des tests (issue #67).
    runs-on: ubuntu-22.04
    # Issue #123 : seulement si docs/latex/, .github/ (la CI comprise) ou les
    # fichiers des contrôles ND de la documentation (tests/controle_doc_nd.R,
    # tests/marques_remplissage.tex, tests/doc_remplissage.tex) changent, comme
    # le filtre « latex » du job « changements » ; tout sur main, push ou lancement
    # manuel. Les tests unitaires de ces contrôles (tests/unitaires/) relèvent du
    # job des tests du moteur.
    needs: changements
    if: needs.changements.outputs.latex == 'true'
    # Durée observée : environ 3 min (3 min 09 s, exécution 42238419349 du
    # 06/11/2026, avec la seconde compilation du remplissage et les contrôles).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: xu-cheng/latex-action@e2f99d4b3685b0da93f97e1b86ad8fab81105098 # v3.3.0
        with:
          root_file: doc_tests_usp.tex
          working_directory: docs/latex
          # latexmk enchaîne les passes nécessaires (table des matières, renvois).
          args: -pdf -interaction=nonstopmode -halt-on-error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: doc_tests_usp
          path: docs/latex/doc_tests_usp.pdf
          if-no-files-found: error
          # Artefact de lecture en cours de branche (ADR 0008 amendé) ; le
          # PDF versionné fait foi une fois le commit de fin de branche fait.
          retention-days: 30
      # Branche ND, lots L0 (issue #451) et L7 (issue #458) : contrôles de la
      # documentation. Les motifs de la liste A, le plafond de pages des fiches et
      # les débordements (\hbox, \vbox > 1,5 pt) sont BLOQUANTS (--bloquant, sans
      # continue-on-error) ; le remplissage des pages reste en avertissement
      # (aucune de ses étapes ne fait échouer le job). Le décompte de chaque étape
      # est publié dans le résumé du job.
      # Remplissage : une seconde compilation, par l'enveloppe tests/doc_remplissage.tex
      # qui charge tests/marques_remplissage.tex avant le document (aucun fichier de
      # docs/latex/ n'est modifié) et écrit doc_remplissage.pdf et .remp dans tests/.
      # Elle est placée après la compilation normale et l'artefact, dont le PDF sert de
      # garde-fou (même texte page pour page). Coût : une compilation de plus.
      - uses: xu-cheng/latex-action@e2f99d4b3685b0da93f97e1b86ad8fab81105098 # v3.3.0
        continue-on-error: true
        with:
          root_file: doc_remplissage.tex
          working_directory: tests
          args: -pdf -interaction=nonstopmode -halt-on-error
      # R seul (aucun paquet) ; même version que le job des tests. Un échec de
      # l'installation ne fait pas échouer cette étape ; il fait échouer l'étape
      # bloquante des contrôles ND (Rscript introuvable), jamais un faux succès.
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        continue-on-error: true
        with:
          r-version: "4.3.1"
      # pdftotext et pdfinfo (poppler-utils), lus par le contrôle du remplissage :
      # absents de l'image ubuntu-22.04 (journal de la CI sur ca7cd03).
      - name: poppler-utils (pdftotext, pdfinfo)
        continue-on-error: true
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends poppler-utils
      # Motifs de « vie du dépôt », plafond de pages des fiches (lit le .aux) et
      # débordements (lit le .log) : sans sélecteur, les trois contrôles, bloquants.
      # Code 1 si une occurrence de la liste A, une fiche au-delà du plafond ou un
      # débordement en violation (tout Overfull \hbox, Overfull \vbox > 1,5 pt).
      - name: Contrôles ND de la documentation (bloquant)
        env:
          LC_ALL: C.UTF-8
        run: |
          statut=0
          Rscript tests/controle_doc_nd.R --bloquant --max-lignes=3 > controle_doc_nd.txt 2>&1 || statut=$?
          cat controle_doc_nd.txt
          {
            echo "### Contrôles ND de la documentation (bloquant)"
            echo
            echo '```'
            grep -v '^::warning' controle_doc_nd.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$statut"
      # Remplissage des pages : lit le PDF et les marques de la seconde compilation.
      # Sans eux (compilation en échec), le script le signale et rend 0. Lancée
      # même si l'étape bloquante ci-dessus a échoué, pour publier les deux bilans.
      - name: Remplissage des pages (avertissement)
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          LC_ALL: C.UTF-8
        run: |
          statut=0
          Rscript tests/controle_doc_nd.R --remplissage \
            --remp=tests/doc_remplissage.remp --pdf-mesure=tests/doc_remplissage.pdf \
            > remplissage_doc_nd.txt 2>&1 || statut=$?
          cat remplissage_doc_nd.txt
          {
            echo "### Remplissage des pages (avertissement)"
            echo
            echo '```'
            grep -v '^::warning' remplissage_doc_nd.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$statut"

  fiches-agents:
    name: Fiches d'agents
    # ADR 0013 : fiches -approfondi conformes a leur fiche de base.
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Fiches -approfondi à jour
        run: bash .claude/outils/fiches_jumelles.sh --verifier
